# litrun Precompiled Engine Binary Registry
# Cross-compiled inference engines tuned per microarchitecture & vector capability

version: "1.0"
engine_type: "llama.cpp"
release_version: "b11741"

targets:
  arm64-a76-dotprod:
    name: "ARM64 Cortex-A76 (Dot Product + FP16)"
    description: "Tuned for Raspberry Pi 5 (BCM2712) and Rockchip RK3588 (Orange Pi 5)"
    arch: "aarch64"
    cflags: "-march=armv8.2-a+fp16+dotprod -O3"
    url: "https://github.com/litrun/litrun/releases/download/v0.1.0/litrun-engine-arm64-a76-v0.1.0.tar.gz"
    sha256: "b6f57134379e43b17937b2ec9c6ae406f8c7b8e19c0b1e16f3d8a43627402681"
    binary_name: "llama-server"
    cli_name: "llama-cli"

  arm64-a72-neon:
    name: "ARM64 Cortex-A72 (NEON)"
    description: "Tuned for Raspberry Pi 4 Model B (BCM2711)"
    arch: "aarch64"
    cflags: "-march=armv8-a+simd -O3"
    url: "https://github.com/litrun/litrun/releases/download/v0.1.0/litrun-engine-arm64-a72-v0.1.0.tar.gz"
    sha256: "77a83d7830cb85bbf1277a16f2c2fe45c924bc98864d46ad5021a8d438062a42"
    binary_name: "llama-server"
    cli_name: "llama-cli"

  arm64-generic:
    name: "ARM64 Generic (NEON Baseline)"
    description: "Portable baseline for Raspberry Pi 3, Pi 4, Pi 5, and generic aarch64"
    arch: "aarch64"
    cflags: "-march=armv8-a -O3"
    url: "https://github.com/ggml-org/llama.cpp/releases/download/b11741/llama-b11741-bin-ubuntu-arm64.tar.gz"
    sha256: "590d34ed66675383447868dfc7f35aabbc6a02dd705c1be27c5c0648fbeef607"
    binary_name: "llama-server"
    cli_name: "llama-cli"

  x86_64-avx2:
    name: "x86_64 (AVX2 + FMA)"
    description: "Tuned for modern x86_64 edge workstations and dev laptops"
    arch: "x86_64"
    cflags: "-mavx2 -mfma -O3"
    url: "https://github.com/ggml-org/llama.cpp/releases/download/b11741/llama-b11741-bin-ubuntu-x64.tar.gz"
    sha256: "a71959bd7e422cc8deb0727f2eb851749d0eb86ba76ad4c7bd4cb95e47083a78"
    binary_name: "llama-server"
    cli_name: "llama-cli"
    strip_components: 1

  x86_64-generic:
    name: "x86_64 Generic"
    description: "Standard portable x86_64 baseline"
    arch: "x86_64"
    cflags: "-O3"
    url: "https://github.com/ggml-org/llama.cpp/releases/download/b11741/llama-b11741-bin-ubuntu-x64.tar.gz"
    sha256: "a71959bd7e422cc8deb0727f2eb851749d0eb86ba76ad4c7bd4cb95e47083a78"
    binary_name: "llama-server"
    cli_name: "llama-cli"
    strip_components: 1
