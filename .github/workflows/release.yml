name: Release & Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Multi-Arch Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu make
          python -m pip install --upgrade pip build wheel

      - name: Package Multi-Arch Release Artifacts
        run: |
          chmod +x scripts/cross_compile_arm64.sh scripts/package_release.sh
          ./scripts/package_release.sh 0.1.0

      - name: Build Python Wheel and sdist
        run: |
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/releases/v0.1.0/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

