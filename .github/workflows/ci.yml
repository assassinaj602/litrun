name: CI Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-c:
    name: C99 Core (GCC & Clang)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Compile C Native Core
        run: |
          CC=${{ matrix.compiler }} make -C core clean all
          CC=${{ matrix.compiler }} make -C core test

  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build C Core Shared Library
        run: |
          make -C core lib

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Run Test Suite
        run: |
          pytest -v tests/ --cov=litrun --cov-report=term-missing

      - name: Test CLI Commands
        run: |
          litrun --help
          litrun inspect
          litrun list
